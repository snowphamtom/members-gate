<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members Gate</title>
<style>
body{margin:0;background:#14080c;color:#f6ecd2;font-family:Georgia,serif}
#veil{position:fixed;inset:0;z-index:5;background:#14080c;display:flex;align-items:center;justify-content:center;transition:opacity 1.2s ease}
#veil.off{opacity:0;pointer-events:none}
.card{width:min(420px,88vw);aspect-ratio:1.6/1;border-radius:18px;position:relative;overflow:hidden;background:#2a120c;box-shadow:0 0 80px #6a2030}
.mist{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 40%,#ffd7a8,transparent 40%),radial-gradient(circle at 70% 60%,#7a1d3a,transparent 46%),radial-gradient(circle at 50% 50%,#1a3a2a,transparent 50%);filter:blur(8px);animation:drift 8s ease-in-out infinite}
.note{position:absolute;inset:8%;border-radius:12px;background:linear-gradient(160deg,#1d4a32,#0e2a1c 60%,#163828);color:#d7e7c8;display:flex;align-items:center;justify-content:center;font-size:64px;letter-spacing:.08em;clip-path:inset(0 100% 0 0);animation:reveal 7s ease forwards}
.note small{position:absolute;bottom:12px;font-size:12px;letter-spacing:.2em}
@keyframes drift{50%{transform:translate3d(12px,-8px,0) scale(1.05)}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
main{max-width:640px;margin:0 auto;padding:48px 20px 64px}
h1{margin:0;letter-spacing:.18em;color:#ffd45a;font-size:36px}
label,input,button{font:inherit}
input[type=file]{display:block;margin:12px 0;color:#f6ecd2}
button{background:#ffd45a;color:#1a100c;border:0;border-radius:999px;padding:10px 16px}
#link{display:none;margin-top:18px}
#link a{color:#ffd45a}
.err{color:#ff8d8d}
</style></head><body>
<div id="veil"><div class="card"><div class="mist"></div><div class="note">100<small>SCREEN</small></div></div></div>
<main>
<h1>MEMBERS GATE</h1>
<p>Upload the closed records. Sorting stays on this screen. The file is not sent to a server.</p>
<form id="form">
<label>CSV with columns label, claimed, interior<input id="file" type="file" accept=".csv,text/csv,text/plain" required></label>
<button type="submit">Sort</button>
</form>
<p id="status"></p>
<p id="link"><a id="next" href="results.html">Open the results</a></p>
<p>A spare does not cover a miss. Taylor Heller, Monsters Ink LLC. Not a grant. Not currency.</p>
</main>
<script>
setTimeout(()=>document.getElementById('veil').classList.add('off'),7200);
function parse(text){
  const rows=text.trim().split(/\r?\n/).filter(Boolean);
  const start=/label/i.test(rows[0])?1:0;
  return rows.slice(start).map(line=>{
    const [label,claimed,interior]=line.split(',').map(s=>s.trim());
    return {label, claimed:Number(claimed), interior:Number(interior)};
  }).filter(r=>r.label);
}
function score(rows){
  const lanes=rows.map(r=>{
    if(!Number.isFinite(r.claimed)||!Number.isFinite(r.interior)) return {label:r.label, claimed:r.claimed, interior:r.interior, headroom:null, result:'missing'};
    const headroom=r.interior-r.claimed;
    return {label:r.label, claimed:r.claimed, interior:r.interior, headroom, result:headroom<0?'refuse':'holds'};
  });
  const admitted=lanes.every(l=>l.result==='holds');
  return {admitted, lanes, created:new Date().toISOString()};
}
document.getElementById('form').onsubmit=async (e)=>{
  e.preventDefault();
  const file=document.getElementById('file').files[0];
  const status=document.getElementById('status');
  const link=document.getElementById('link');
  link.style.display='none';
  if(!file){status.textContent='Choose a file.';return;}
  status.textContent='Sorting.';
  try{
    const decision=score(parse(await file.text()));
    sessionStorage.setItem('members-gate-decision', JSON.stringify(decision));
    status.textContent=decision.admitted?'Sorting finished. Admitted.':'Sorting finished. Refused.';
    link.style.display='block';
  }catch(err){
    status.innerHTML='<span class="err">The file could not be read. Use label, claimed, interior.</span>';
  }
};
</script></body></html>
