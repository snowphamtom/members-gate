<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members Gate</title>
<style>
html,body{margin:0;min-height:100%;color:#efe6d6;font-family:Georgia,serif;background:#121418}
main{max-width:680px;margin:0 auto;padding:28px 22px 48px}
h1{letter-spacing:.22em;font-weight:500;font-size:28px;color:#f3ead8;margin:0 0 6px}
.lead{margin:0 0 14px;color:#d9d0c2}
.stage{padding:14px;background:linear-gradient(#2a241c,#17140f);border-radius:18px}
video{width:100%;height:260px;object-fit:cover;display:block;background:#07080c;border-radius:12px}
.rail{display:flex;justify-content:space-between;margin:10px 2px 0;font-size:12px;letter-spacing:.14em;color:#b7ab9c}
.rail b{color:#f3ead8;font-weight:500}
a.go{background:#c9b48a;color:#1a140e;border:0;border-radius:999px;padding:11px 16px;font-weight:700;text-decoration:none;display:inline-block}
.foot{font-size:13px;color:#b7ab9c}
</style></head><body><main>
<h1>MEMBERS GATE</h1>
<p class="lead">The sheet folds.</p>
<div class="stage"><video id="fold" autoplay muted loop playsinline controls preload="auto" src="https://tmpfiles.org/dl/1791132589.e8de825986bcdf27/wMA3f6tmUCGl/fold.mp4" aria-label="Twelve second origami bill fold"></video>
<div class="rail"><span id="phase">SHEET</span><b id="clock">0.0 / 12.2</b></div></div>
<p><a class="go" href="https://tmpfiles.org/dl/1791132589.e8de825986bcdf27/wMA3f6tmUCGl/fold.mp4">Open the fold</a></p>
<p class="foot">Taylor Heller, Monsters Ink LLC. A screen, not a print plate. Not a grant.</p>
</main>
<script>
const fold=document.getElementById('fold');
const phase=document.getElementById('phase');
const clock=document.getElementById('clock');
const names=['SHEET','CREASE','WING','CRANE'];
function startFold(){fold.muted=true; const p=fold.play(); if(p) p.catch(()=>{});}
fold.addEventListener('loadeddata', startFold);
fold.addEventListener('canplay', startFold);
startFold();
fold.addEventListener('timeupdate', ()=>{const d=fold.duration||12.17; const i=Math.min(3,Math.floor(fold.currentTime/(d/4))); phase.textContent=names[i]; clock.textContent=fold.currentTime.toFixed(1)+' / '+d.toFixed(1);});
</script></body></html>
