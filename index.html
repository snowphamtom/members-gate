<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members Gate</title>
<style>
html,body{margin:0;min-height:100%;color:#efe6d6;font-family:Georgia,serif}
body{background-color:#121418;background-image:linear-gradient(rgba(7,8,12,.55),rgba(7,8,12,.55)),repeating-linear-gradient(90deg,#3a4048 0 2px,transparent 2px 92px),repeating-linear-gradient(#3a4048 0 2px,transparent 2px 54px);padding-bottom:250px}
main{max-width:680px;margin:0 auto;padding:42px 22px 20px;background:rgba(7,8,12,.72);border:1px solid rgba(201,180,138,.28);position:relative;z-index:1}
h1{letter-spacing:.22em;font-weight:500;font-size:28px;color:#f3ead8;margin:0 0 12px}
p,label{line-height:1.55;color:#d9d0c2}
input[type=file]{display:block;margin:12px 0}
button,a.go{background:#c9b48a;color:#1a140e;border:0;border-radius:999px;padding:11px 16px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer;margin:0 6px 8px 0}
#next{display:none;margin-top:18px}
.foot{font-size:13px;color:#b7ab9c}
.fold{position:fixed;left:0;right:0;bottom:0;height:230px;display:flex;align-items:flex-end;justify-content:center;z-index:20}
canvas{width:min(560px,96vw);height:210px;background:#07080c;border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.7);position:relative;z-index:21}
.mark{position:absolute;right:16px;bottom:12px;z-index:22;font-size:11px;letter-spacing:.22em;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:999px}
</style></head><body>
<main>
<h1>MEMBERS GATE</h1>
<p>Upload the closed records. Claimed and interior, by label. When the sort finishes, the result link appears.</p>
<form id="up"><label>Records file, JSON or CSV <input id="file" type="file" accept=".json,.csv,application/json,text/csv"></label>
<p><button type="submit">Sort</button> <button type="button" id="sample">Use the closed case</button></p></form>
<p id="next"><a class="go" href="results.html">Open the result</a> <button type="button" id="save">Download</button></p>
<p class="foot">Taylor Heller, Monsters Ink LLC. The file stays in this browser. Not a grant. The note is a screen, not currency.</p>
</main>
<div class="fold"><canvas id="fold" width="560" height="210" aria-label="Screen bill folding into animals"></canvas><span class="mark" id="mark">BILL</span></div>
<script>
const names=["CRANE","FOX","FROG","BUTTERFLY","ELEPHANT","SWAN","RABBIT","FISH","OWL","TURTLE","DRAGON","HORSE"];
const animals=[
[[70,48],[150,18],[210,78],[250,28],[300,86],[214,118],[132,104]],
[[86,92],[154,36],[196,74],[236,32],[286,84],[246,122],[116,122]],
[[64,112],[136,68],[186,92],[226,46],[276,92],[304,122],[84,126]],
[[160,82],[66,28],[36,72],[118,92],[36,132],[88,148],[160,102],[232,148],[286,132],[198,92],[286,72],[248,28]],
[[54,122],[124,68],[166,92],[214,36],[256,96],[326,68],[344,122]],
[[76,122],[186,122],[214,68],[274,26],[218,54],[166,22],[136,82]],
[[96,122],[154,46],[174,92],[194,26],[214,92],[256,38],[304,122]],
[[36,92],[146,48],[236,54],[326,92],[236,128],[146,132]],
[[86,122],[124,36],[166,72],[206,32],[256,82],[286,122]],
[[66,112],[146,78],[186,36],[236,42],[296,86],[314,122],[176,128]],
[[46,112],[146,122],[186,58],[246,16],[214,82],[306,38],[264,112],[166,128]],
[[76,122],[154,68],[196,92],[236,36],[276,86],[336,52],[314,122]]
];
const bill=[[40,78],[300,78],[300,138],[40,138]];
const c=document.getElementById("fold"), g=c.getContext("2d"), mark=document.getElementById("mark");
let t0=performance.now();
function mix(a,b,k){const n=Math.max(a.length,b.length), o=[]; for(let i=0;i<n;i++){const p=a[Math.min(i,a.length-1)], q=b[Math.min(i,b.length-1)]; o.push([p[0]+(q[0]-p[0])*k, p[1]+(q[1]-p[1])*k]);} return o;}
function poly(pts, lift){
  g.save(); g.translate(128,16-lift);
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath();
  g.fillStyle="#f4efe4"; g.fill(); g.strokeStyle="#c45c84"; g.lineWidth=2; g.stroke();
  g.strokeStyle="rgba(90,60,50,.4)"; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); g.lineTo(pts[Math.floor(pts.length/2)][0],pts[Math.floor(pts.length/2)][1]); g.stroke();
  g.restore();
}
function frame(now){
  const t=(now-t0)/1000, step=2.6, i=Math.floor(t/step)%names.length, k=(t%step)/step;
  const folding=k<0.62;
  const fold=folding?k/0.62:1;
  const lift=folding?0:Math.sin((k-0.62)/0.38*Math.PI)*34;
  mark.textContent=fold<0.18?"BILL":names[i];
  g.clearRect(0,0,560,210);
  g.fillStyle="#07080c"; g.fillRect(0,0,560,210);
  for(let w=0;w<6;w++){g.strokeStyle="rgba(70,110,130,.2)"; g.beginPath(); g.moveTo(0,160+w*6); g.bezierCurveTo(150,154+Math.sin(t+w)*4,360,168,560,158+w*6); g.stroke();}
  const armY=42+lift;
  g.strokeStyle="#c9b48a"; g.lineWidth=3; g.beginPath(); g.moveTo(34,4); g.lineTo(270,armY); g.stroke();
  g.fillStyle="#8a7048"; g.beginPath(); g.arc(270,armY,4,0,6.3); g.fill();
  g.strokeStyle="#efe6d6"; g.lineWidth=1; g.beginPath(); g.moveTo(270,armY); g.lineTo(250,108-lift); g.stroke();
  poly(mix(bill, animals[i], fold), lift);
  if(fold<0.45){g.fillStyle="#1a140e"; g.font="14px Georgia"; g.fillText("SCREEN",188,118-lift*0.2);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function decide(claimed, interior){const lanes=[]; let admitted=true; Object.keys(claimed).forEach(label=>{const v=Number(claimed[label]); if(!(label in interior)){lanes.push({label,claimed:v,interior:null,headroom:null,reason:"missing"}); admitted=false; return;} const n=Number(interior[label]); const h=n-v; const reason=h<0?"deficit":"fit"; if(reason!=="fit") admitted=false; lanes.push({label,claimed:v,interior:n,headroom:h,reason});}); if(!lanes.length) admitted=false; return {admitted,lanes,failing:lanes.filter(l=>l.reason!=="fit")};}
function fromText(name, text){if(name.endsWith(".csv")||text.trim().charAt(0)!=="{"){const rows=text.trim().split(/\r?\n/).slice(1); const claimed={}, interior={}; rows.forEach(row=>{const [label,c,n]=row.split(",").map(s=>s.trim()); if(!label) return; claimed[label]=Number(c); interior[label]=Number(n);}); return {claimed, interior};} const data=JSON.parse(text); return {claimed:data.claimed, interior:data.interior};}
function csvOf(d){const lines=["label,claimed,interior,headroom,call"]; d.lanes.forEach(l=>lines.push([l.label,l.claimed,l.interior==null?"":l.interior,l.headroom==null?"":l.headroom,l.reason].join(","))); lines.push("decision,"+(d.admitted?"admit":"refuse")); return lines.join("\n")+"\n";}
function download(){const raw=sessionStorage.getItem("membersGateResult"); if(!raw) return; const blob=new Blob([csvOf(JSON.parse(raw))],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="members-gate-result.csv"; a.click();}
function run(claimed, interior){sessionStorage.setItem("membersGateResult", JSON.stringify(decide(claimed, interior))); document.getElementById("next").style.display="none"; setTimeout(()=>{document.getElementById("next").style.display="block";}, 1600);}
document.getElementById("up").onsubmit=async (e)=>{e.preventDefault(); const file=document.getElementById("file").files[0]; if(!file) return; const parsed=fromText(file.name.toLowerCase(), await file.text()); run(parsed.claimed, parsed.interior);};
document.getElementById("sample").onclick=()=>run({A:1,B:0,C:1,D:1},{A:1,B:1,C:0,D:1});
document.getElementById("save").onclick=download;
</script></body></html>
